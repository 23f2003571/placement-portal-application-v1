{% extends "base.html" %}
{% block title %}Create Student Profile{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        background: linear-gradient(135deg, #141517, #3a3f47);
        color: #e2e8f0;
    }
    .container {
        width: 95%;
        margin: auto;
    }
  .card{
        background:rgba(255,255,255,0.05);
        border: 1px solid #737373;
        border-radius: 50px;
        padding: 30px;
        margin: 25%;
        margin-top: 10px;
        margin-bottom: 0%;
  }
   h1 {
        text-align: center;
        color: #fffcfc;
    }
    label {
      font-weight: bold;
        color: #ffffff;
        text-shadow: 15px 15px 15px #000000;
    }
    button {
        margin-left: 45%;
    }
   .btn{
     border-radius: 15px;
  }
</style>
<div  class="container">
   <h1>Student Profile</h1>
   <div class="card">
<form action="/student_profile" method="POST">
   <div>
      <label for="Input1" class="form-label">Student Name :</label>
      <input name="student_name" type="text" class="form-control" id="Input1" placeholder="your name"><br>
   </div>
   <div>
      <label for="Input2" class="form-label">Department :</label>
      <input name="department" value="{{ student.department if student else '' }}" type="text" class="form-control" id="Input2" placeholder="department"><br>
   </div>
   <div>
      <label for="Input3" class="form-label">Cgpa :</label>
      <textarea name="cgpa"  class="form-control" id="Input3" placeholder="your cgpa"></textarea><br>
   </div>
   <div>
      <label for="Input4" class="form-label">Resume Link :</label>
      <input name="resume" type="url" class="form-control" id="Input4" placeholder="Paste your resume Google Drive link"><br>
   </div>
   <div>
      <button type="submit" class="btn btn-success">Save</button></div>
</div>
</form>
</div>
{% endblock %}
