<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>login page</title>
   <!-- "{{ url_for('static', filename='style.css') }}" -->
    <link rel="stylesheet" href="/static/style.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="margin:8px;">
    <div id="main">
      <div id="canvas">
         <div id="canvas1">
         <div id="canvas2">
            <form action="/login" method="post">
               <h1>Login Form</h1><br>
               <div class="mb-3">
                  <label for="Input1" class="form-label">Registered Email ID:</label>
                  <input type="text" class="form-control" id="Input1" placeholder="name@gmail.com" name="username">
               </div>
               <div class="mb-3">
                  <label for="Input2" class="form-label">Password:</label>
                  <input type="password" class="form-control" id="Input2" name="password">
               </div>
               <div style="text-align: center;">
                  <input type="submit" class="btn btn-primary" value="Login"><br>
                  Are you a new user? <a href="/register">Register</a>
               </div>
            </form>
         </div>
      </div>
      </div>
    </div>
</body>
</html>
